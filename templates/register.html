{% extends "layout.html" %}

{% block body_class %}login-page{% endblock %}

{% block body %}
<div class="center-container">

    <h2 class="app-title">Thrive</h2>

    <div class="nes-container with-title is-centered">
        <p class="title">Register</p>
        <form action="/register" method="post">
            <div class="nes-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="nes-input" required>
            </div>
            <div class="nes-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="nes-input" required>
            </div>
            <div class="nes-field">
                <label for="confirmation">Confirm Password</label>
                <input type="password" id="confirmation" name="confirmation" class="nes-input" required>
            </div>
            <button type="submit" class="nes-btn is-primary">Register</button>
        </form>
        <a href="/login">Already have an account? Login here.</a>
    </div>
    
</div>
{% endblock %}
