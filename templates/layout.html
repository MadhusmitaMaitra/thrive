<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Import both fonts we need -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link href="/static/nes.css" rel="stylesheet" />
    <link href="/static/style.css" rel="stylesheet" />
    
    <title>Thrive</title>
</head>
<!-- This body tag is now dynamic. We can inject a class from other pages. -->
<body class="{% block body_class %}{% endblock %}">
    
    <!-- This is the main content block -->
    {% block body %}{% endblock %}

    <!-- This is for the star animation if needed -->
    {% block animations %}{% endblock %}

</body>
</html>
